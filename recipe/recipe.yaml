schema_version: 1

context:
  version: "1.4.2"

package:
  name: pystac-ext-mlm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-mlm/pystac_ext_mlm-${{ version }}.tar.gz
  sha256: 9335bd554c43f829b5dcfc954f3d35be2d0de15b6fb82aac6048b1316707b37b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core
    # imported but not declared as a dependency
    - pystac-ext-classification
    - pystac-ext-raster


tests:
  - python:
      imports:
        - pystac.extensions.mlm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Machine Learning Model extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-mlm/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
